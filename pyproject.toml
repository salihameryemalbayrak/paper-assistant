[project]
name = "paper-assistant"
version = "0.1.0"
description = "Turkish question answering over open-access AI papers with cited sources (hybrid search, reranking, eval)."
readme = "README.md"
requires-python = ">=3.11"
# Versions are intentionally unpinned here; exact versions are locked in uv.lock.
dependencies = [
    "fastapi>=0.165.0",
    "langchain-classic>=1.1.0",
    "langchain-huggingface>=1.3.0",
    "langchain-openai",
    "langchain-qdrant>=1.2.0",
    "langchain-text-splitters>=1.2.0",
    "langfuse>=5.2.0",
    "pydantic-settings",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    # Listed directly (sentence-transformers needs it) so that [tool.uv.sources] below applies.
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
eval = [
    "ragas>=0.4.4",
]
ingest = [
    "docling>=2.152.0",
]
ui = [
    "httpx>=0.28",
    "pydantic-settings>=2",
    "streamlit>=1.67.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, UP: modern syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# The "ingest" group (Docling and its layout models) is installed locally by default.
# CI skips it with --no-group ingest: it is large and only needed to parse PDFs.
default-groups = ["dev", "ingest"]

# On Linux (CI, Docker images) install the CPU-only PyTorch build. The default Linux build
# from PyPI bundles several GB of CUDA libraries we never use. macOS keeps the PyPI build.
# See https://docs.astral.sh/uv/guides/integration/pytorch/
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true  # only packages listed in [tool.uv.sources] come from this index
