name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # --no-group ingest skips Docling (ingest tests are skipped). PyTorch is a main
      # dependency: the CPU-only build on Linux (pyproject.toml, tool.uv.sources).
      - name: Install dependencies
        run: uv sync --locked --no-group ingest

      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync pytest -rs  # -rs: list skipped tests with reasons

  # Retrieval quality on the 49-question eval set, no LLM (D42). The PDFs and the index
  # are not in git: the chunks come from a GitHub Release asset (eval/ci_data.json says
  # which one and its SHA-256), and Qdrant runs in memory (QDRANT_URL=:memory:).
  fast-eval:
    runs-on: ubuntu-latest
    env:
      QDRANT_URL: ":memory:"
      PYTHONUNBUFFERED: "1" # print progress at once, not when the pipe buffer fills
      # required settings; the fast eval never calls an LLM
      LLM_BASE_URL: http://unused
      LLM_MODEL: unused
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --no-group ingest

      - name: Download the chunk file (release asset) and check its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c "import json; print(json.load(open('eval/ci_data.json'))['tag'])")
          gh release download "$tag" --pattern chunks.jsonl.gz --dir data
          gunzip data/chunks.jsonl.gz
          uv run --no-sync python -m eval.ci_data verify data/chunks.jsonl

      # the embedding model (~470 MB) is downloaded once, not on every run
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-multilingual-e5-small

      - name: Fast eval
        run: |
          set -o pipefail  # keep the eval's exit code through tee
          # Quality gate for the default retriever, about one question below its measured
          # baseline (2026-11-28, hybrid_en: recall@5 0.780, evidence recall@5 0.707; D42, D46).
          # Lower these only deliberately, together with the change that needs it.
          uv run --no-sync python -m eval.run --fast --retriever hybrid_en \
            --min-recall5 0.75 --min-evidence5 0.67 | tee fast-eval.log
          cp "$(sed -n 's/^saved -> //p' fast-eval.log)" fast-eval-result.json

      - name: Keep the result file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-eval-result
          path: |
            fast-eval-result.json
            fast-eval.log


  # The API and UI images build on amd64 (GitHub runners); a Mac checks arm64 locally (D45).
  # Built only, never pushed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image (amd64)
        run: docker build -f infra/Dockerfile --target api -t paper-assistant-api:ci .

      - name: Build the UI image (amd64)
        run: docker build -f infra/Dockerfile --target ui -t paper-assistant-ui:ci .

      - name: Smoke test (CPU-only PyTorch, no PyTorch in the UI)
        run: |
          docker run --rm paper-assistant-api:ci python -c "import torch, platform; assert torch.version.cuda is None; print(torch.__version__, platform.machine())"
          docker run --rm paper-assistant-ui:ci python -c "import importlib.util as u, streamlit; assert u.find_spec('torch') is None; print('streamlit', streamlit.__version__)"
